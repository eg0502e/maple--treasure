<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 新楓之谷 - 全動態對帳系統 (雲端即時同步版)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-sub-bg: #282828;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary-color: #ff9f43;
            --danger-color: #ee5253;
            --success-color: #10ac84;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px; display: flex; justify-content: center;
        }

        .container { width: 100%; max-width: 1800px; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 25px; }

        .layout-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) {
            .layout-grid { grid-template-columns: 420px 1fr; align-items: start; }
        }

        .side-column, .main-column { display: flex; flex-direction: column; gap: 20px; }

        .card {
            background-color: var(--card-bg); border-radius: 8px; padding: 20px;
            border: 1px solid var(--border-color); box-sizing: border-box; width: 100%;
        }

        .card h2 {
            margin-top: 0; color: var(--primary-color); font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }

        input[type="text"], input[type="number"], select {
            width: 100%; padding: 8px 10px; background-color: #111;
            border: 1px solid var(--border-color); border-radius: 4px; color: #fff;
            box-sizing: border-box; font-size: 0.88rem;
            text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
        }

        .btn { background-color: var(--primary-color); color: #111; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; white-space: nowrap; font-size: 0.88rem; }
        .btn:hover { background-color: #ffb366; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-secondary { background-color: #444; color: white; }

        #syncStatus {
            position: fixed; bottom: 15px; right: 15px;
            background: #222; border: 1px solid var(--primary-color); color: var(--primary-color);
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; z-index: 10000;
        }

        /* 1. 主要人員 */
        #peopleContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .person-card { background: #252525; border: 1px solid #3d3d3d; border-radius: 6px; overflow: hidden; height: fit-content; }
        .person-header { padding: 8px 10px; background: #2c2c2c; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; color: #ffb366; font-size: 0.88rem; }
        .person-body { padding: 8px; display: none; border-top: 1px solid #383838; }
        .person-card.open .person-body { display: block; }
        .sub-list-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .sub-tag-draggable {
            background: #333; border: 1px solid #ff9f43; color: #fff;
            padding: 5px 10px; border-radius: 14px; font-size: 0.82rem;
            display: inline-flex; align-items: center; gap: 6px; cursor: grab; user-select: none;
        }

        /* 2. BOSS 標籤卡片 */
        #bossCategoryContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .boss-pill-card {
            background: #252525; border: 1px solid #444; border-radius: 8px;
            padding: 12px 14px; cursor: pointer; transition: all 0.2s ease;
            display: flex; justify-content: space-between; align-items: center;
        }
        .boss-pill-card:hover { background: #333; border-color: var(--primary-color); transform: translateY(-2px); }
        .boss-pill-info { display: flex; flex-direction: column; }
        .boss-pill-name { font-size: 1rem; font-weight: bold; color: var(--primary-color); }
        .boss-pill-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

        /* 行事曆與個人提醒 */
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .day-card { background: #181818; border: 1px solid #333; border-radius: 6px; padding: 10px; min-height: 100px; display: flex; flex-direction: column; gap: 6px; }
        .day-title { font-size: 0.85rem; font-weight: bold; color: var(--primary-color); border-bottom: 1px solid #282828; padding-bottom: 4px; }
        .day-event { background: #282828; border-left: 3px solid var(--primary-color); padding: 4px 6px; border-radius: 3px; font-size: 0.78rem; }
        .personal-schedule-box { background: #181818; border: 1px solid #333; border-radius: 6px; padding: 15px; }
        .schedule-item { padding: 8px 10px; background: #222; border-radius: 4px; margin-bottom: 6px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }

        /* 帳務 */
        .summary-box { background-color: #111; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; border-left: 4px solid var(--primary-color); }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85rem; }
        .summary-line.total { font-size: 0.95rem; font-weight: bold; color: var(--primary-color); border-top: 1px solid #333; padding-top: 6px; }
        .ledger-table { width: 100%; border-collapse: collapse; }
        .ledger-table th, .ledger-table td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #333; font-size: 0.82rem; }
        .ledger-table th { color: var(--text-muted); background-color: #111; }
        .val-positive { color: var(--success-color); font-weight: bold; font-family: monospace; font-size: 0.88rem; }
        .val-negative { color: var(--danger-color); font-weight: bold; font-family: monospace; font-size: 0.88rem; }
        .status-btn { padding: 3px 6px; border-radius: 4px; border: none; cursor: pointer; font-size: 0.72rem; font-weight: bold; }
        .status-pending { background-color: #e74c3c; color: white; }
        .status-paid { background-color: #2ecc71; color: #111; }
        .boss-detail-text { font-size: 0.75rem; color: #a0a0a0; margin-top: 4px; line-height: 1.3; }
        .empty-tip { color: #666; font-size: 0.82rem; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-overlay.open { display: flex; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 92vw; max-width: 1400px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px 20px; background: #282828; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: var(--primary-color); font-size: 1.3rem; }
        .modal-close-btn { font-size: 1.6rem; color: #aaa; cursor: pointer; background: none; border: none; }
        .modal-body { display: flex; flex: 1; overflow: hidden; }
        .modal-sidebar { width: 240px; background: #181818; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .modal-sidebar h4 { margin: 0 0 10px 0; color: var(--primary-color); font-size: 0.95rem; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .modal-main { flex: 1; padding: 20px; overflow-y: auto; }
        .teams-grid-vertical { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 15px; }
        .team-card { background: var(--card-sub-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .team-header { padding: 12px 16px; background: #222; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; font-weight: bold; color: #ffb366; }
        .team-body { padding: 16px; display: none; border-top: 1px solid #333; }
        .team-card.open .team-body { display: block; }
        .member-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .drop-zone { min-height: 52px; background: #111; border: 2px dashed #444; border-radius: 6px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
        .drop-zone.share-zone { border-color: #10ac84; }
        .drop-zone.no-share-zone { border-color: #ee5253; }
        .drop-zone.drag-over { background: #221a10; }
        .member-chip { padding: 4px 10px; border-radius: 14px; font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .member-chip.chip-share { background: var(--primary-color); color: #111; }
        .member-chip.chip-no-share { background: #444; color: #ff6b6b; border: 1px solid #ee5253; }
        .member-chip span { cursor: pointer; color: #800; font-weight: bold; }
        .item-row { background: #181818; border: 1px solid #383838; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
        .item-main { display: grid; grid-template-columns: 1.3fr 1.5fr 1.2fr 1.2fr auto; gap: 10px; align-items: center; }
        .scissors-section { background: #222; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .scissors-row { display: grid; grid-template-columns: 1.3fr 1.2fr auto; gap: 8px; margin-bottom: 6px; }
    </style>

    <!-- 引入 Firebase SDK (Modular v10) 並帶入你的 Config -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmSTqbpIN8Z0VIwpBXrqAhR2KuZcfQM4A",
            authDomain: "maple-treasure.firebaseapp.com",
            projectId: "maple-treasure",
            storageBucket: "maple-treasure.firebasestorage.app",
            messagingSenderId: "635574213905",
            appId: "1:635574213905:web:750d817ac1526901b0c0b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "mapleData", "partySystem");

        let isRemoteUpdate = false;

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const cloudData = docSnap.data();
                isRemoteUpdate = true;

                if (cloudData.people) people = cloudData.people;
                if (cloudData.bossCategories) bossCategories = cloudData.bossCategories;
                if (cloudData.payoutStatus) payoutStatus = cloudData.payoutStatus;

                render();
                if (currentEditingCatIndex !== null) {
                    renderModalContent();
                }
                document.getElementById('syncStatus').innerText = "🟢 雲端已同步";
                isRemoteUpdate = false;
            }
        });

        window.saveToCloud = async function() {
            if (isRemoteUpdate) return;
            document.getElementById('syncStatus').innerText = "🟡 儲存中...";
            try {
                await setDoc(docRef, {
                    people: people,
                    bossCategories: bossCategories,
                    payoutStatus: payoutStatus,
                    lastUpdated: new Date().getTime()
                });
                document.getElementById('syncStatus').innerText = "🟢 雲端已同步";
            } catch (err) {
                console.error("雲端儲存失敗：", err);
                document.getElementById('syncStatus').innerText = "🔴 儲存失敗";
            }
        };
    </script>
</head>
<body>

<div id="syncStatus">🟡 連線中...</div>

<div class="container">
    <h1>🍁 新楓之谷 - 全動態對帳系統 (雲端即時同步版)</h1>

    <div class="layout-grid">
        <div class="side-column">
            <!-- 1. 主要人員 -->
            <div class="card">
                <h2><span>1. 主要人員與子區域管理</span></h2>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" id="mainPersonInput" placeholder="主要人員 (如: 百萬)">
                    <button class="btn" onclick="addMainPerson()">新增人員</button>
                </div>
                <div id="peopleContainer"></div>
            </div>

            <!-- 3. 帳務總覽 -->
            <div class="card">
                <h2><span>3. 帳務總覽與匯款追蹤</span></h2>
                <div class="summary-box">
                    <div class="summary-line"><span>拍賣總銷售：</span><span id="sumGross">0</span></div>
                    <div class="summary-line total"><span>扣稅 3% 後總淨利：</span><span id="sumNet">0</span></div>
                </div>

                <table class="ledger-table">
                    <thead>
                        <tr>
                            <th style="width: 28%;">人員</th>
                            <th style="width: 50%;">最終金額 (金流明細)</th>
                            <th style="width: 22%;">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerBody"></tbody>
                </table>

                <button class="btn btn-secondary" onclick="copyLedger()" style="width: 100%; margin-top: 12px; padding: 8px; font-size: 0.85rem;">📋 複製主要人員總帳單</button>
            </div>
        </div>

        <div class="main-column">
            <!-- 2. BOSS 標籤卡片區 -->
            <div class="card">
                <h2><span>2. 寶物項目與幫撿成本設定 (點擊 BOSS 開啟大視窗編輯)</span></h2>
                <div style="display: flex; gap: 8px; margin-bottom: 15px; max-width: 380px;">
                    <input type="text" id="newBossCategoryInput" placeholder="BOSS 名稱 (如: 龍王)">
                    <button class="btn" onclick="addBossCategory()">➕ 新增 BOSS 類別</button>
                </div>
                <div id="bossCategoryContainer"></div>
            </div>

            <!-- 本週王團行程表與個人提醒 -->
            <div class="card">
                <h2><span>📅 本週王團出團行程表</span></h2>
                <div class="calendar-grid" id="calendarGrid"></div>

                <h2>
                    <span>🔔 個人出團提醒</span>
                    <select id="selectedPersonReminder" style="width:160px; font-size:0.85rem;" onchange="renderSchedule()">
                    </select>
                </h2>
                
                <div class="personal-schedule-box">
                    <div id="personalScheduleList"></div>
                    <button class="btn btn-secondary" onclick="copyPersonalSchedule()" style="width:100%; margin-top:10px; padding:8px;">📋 複製該成員本週行程通知</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 彈出大視窗 Modal -->
<div class="modal-overlay" id="bossModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">BOSS 隊伍與寶物管理</h3>
            <button class="modal-close-btn" onclick="closeBossModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-sidebar">
                <h4>👈 可拖曳人員池</h4>
                <div id="modalSubPool" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>

            <div class="modal-main" id="modalMainContent"></div>
        </div>
    </div>
</div>

<script>
    let people = [
        { id: 1, name: "百萬", subs: ["百萬-箭神", "百萬-劍豪", "百萬-聖騎"] },
        { id: 2, name: "Distiny", subs: ["Distiny-主教"] },
        { id: 3, name: "小明", subs: ["小明-英雄"] },
        { id: 4, name: "阿強", subs: ["阿強-槍神"] },
        { id: 5, name: "老張", subs: ["老張-影武"] },
        { id: 6, name: "小花", subs: ["小花-精靈"] }
    ];
    let openPeople = {};

    let bossCategories = [
        {
            id: 'cat_1', name: "🔥 炎魔",
            teams: [{ id: 'team_1', name: "炎魔-A", day: "週一", time: "19:00", shareMembers: ["百萬-箭神", "Distiny-主教"], noShareMembers: [], items: [{ type: "normal", name: "其餘物品總和", price: "", sellerName: "" }] }]
        },
        {
            id: 'cat_2', name: "🐉 龍王",
            teams: [
                { id: 'team_2', name: "龍王-A", day: "週三", time: "19:00", shareMembers: ["百萬-劍豪"], noShareMembers: [], items: [] },
                { id: 'team_3', name: "龍王-B", day: "週三", time: "20:00", shareMembers: ["百萬-聖騎"], noShareMembers: [], items: [] }
            ]
        },
        { id: 'cat_3', name: "⚡ 皮卡丘", teams: [] },
        { id: 'cat_4', name: "🐍 阿卡伊農", teams: [] },
        { id: 'cat_5', name: "👑 西格諾斯", teams: [] },
        { id: 'cat_6', name: "👹 森藍丸", teams: [] }
    ];

    let currentEditingCatIndex = null;
    let openModalTeams = {};
    let openLedgerDetails = {};
    let payoutStatus = {};
    let draggedSubName = null;

    const daysList = ["週一", "週二", "週三", "週四", "週五", "週六", "週日"];

    function formatTimeInput(val) {
        if (!val) return '';
        let clean = val.trim();
        if (/^\d{3,4}$/.test(clean)) {
            if (clean.length === 3) clean = '0' + clean;
            return clean.substring(0, 2) + ':' + clean.substring(2, 4);
        }
        if (/^\d{1,2}$/.test(clean)) {
            let num = parseInt(clean, 10);
            if (num >= 0 && num <= 23) {
                return (num < 10 ? '0' + num : num) + ':00';
            }
        }
        return clean;
    }

    function getAllSubMembers() {
        let subs = [];
        people.forEach(p => { if (p.subs) subs.push(...p.subs); });
        return subs;
    }

    function getMainPersonBySub(subName) {
        const found = people.find(p => p.subs && p.subs.includes(subName));
        return found ? found.name : subName;
    }

    function purgeMemberFromAllBosses(memberName) {
        bossCategories.forEach(cat => {
            cat.teams.forEach(team => {
                if (team.shareMembers) team.shareMembers = team.shareMembers.filter(m => m !== memberName);
                if (team.noShareMembers) team.noShareMembers = team.noShareMembers.filter(m => m !== memberName);
                team.items.forEach(item => {
                    if (item.sellerName === memberName) item.sellerName = "";
                    if (item.scissors) {
                        item.scissors = item.scissors.filter(s => s.helperName !== memberName);
                    }
                });
            });
        });
    }

    function addMainPerson() {
        const input = document.getElementById('mainPersonInput');
        const name = input.value.trim();
        if (!name) return;
        if (people.some(p => p.name === name)) return alert('已有同名主要人員！');

        const newId = Date.now();
        people.push({ id: newId, name: name, subs: [`${name}-A`] });
        openPeople[newId] = false;
        input.value = '';
        render();
        if (window.saveToCloud) window.saveToCloud();
    }

    function deleteMainPerson(pIndex) {
        const person = people[pIndex];
        if (confirm(`確定刪除「${person.name}」？這將會同步清除該人員在所有王團中的紀錄！`)) {
            if (person.subs) {
                person.subs.forEach(subName => purgeMemberFromAllBosses(subName));
            }
            people.splice(pIndex, 1);
            render();
            if (window.saveToCloud) window.saveToCloud();
        }
    }

    function addSubItem(pIndex) {
        const input = document.getElementById(`subInput-${pIndex}`);
        const subName = input.value.trim();
        if (!subName) return;
        if (getAllSubMembers().includes(subName)) return alert('名稱重複！');

        people[pIndex].subs.push(subName);
        input.value = '';
        render();
        if (window.saveToCloud) window.saveToCloud();
    }

    function deleteSubItem(pIndex, sIndex) {
        const subName = people[pIndex].subs[sIndex];
        if (confirm(`確定刪除子項「${subName}」？這將會同步清除他在所有王團中的紀錄！`)) {
            purgeMemberFromAllBosses(subName);
            people[pIndex].subs.splice(sIndex, 1);
            render();
            if (window.saveToCloud) window.saveToCloud();
        }
    }

    function addBossCategory() {
        const input = document.getElementById('newBossCategoryInput');
        const name = input.value.trim();
        if (!name) return;

        const newCatId = `cat_${Date.now()}`;
        bossCategories.push({ id: newCatId, name: name, teams: [] });
        input.value = '';
        render();
        if (window.saveToCloud) window.saveToCloud();
    }

    function deleteBossCategory(cIndex) {
        if (confirm(`確定刪除【${bossCategories[cIndex].name}】及其底下的所有隊伍嗎？`)) {
            bossCategories.splice(cIndex, 1);
            closeBossModal();
            render();
            if (window.saveToCloud) window.saveToCloud();
        }
    }

    function openBossModal(cIndex) {
        currentEditingCatIndex = cIndex;
        bossCategories[cIndex].teams.forEach(t => { openModalTeams[t.id] = false; });
        document.getElementById('bossModal').classList.add('open');
        renderModalContent();
    }

    function closeBossModal() {
        currentEditingCatIndex = null;
        document.getElementById('bossModal').classList.remove('open');
        render();
    }

    function toggleModalTeamOpen(teamId) {
        openModalTeams[teamId] = !openModalTeams[teamId];
        renderModalContent();
    }

    function addTeamToCategory(cIndex) {
        const cat = bossCategories[cIndex];
        const defaultLetter = String.fromCharCode(65 + cat.teams.length);
        const cleanCatName = cat.name.replace(/^[^\s]+\s*/, '');
        const defaultTeamName = `${cleanCatName}-${defaultLetter}`;

        const inputName = prompt(`請輸入隊伍名稱：`, defaultTeamName);
        if (inputName === null) return;

        const teamName = inputName.trim() || defaultTeamName;
        const newTeamId = `team_${Date.now()}`;

        cat.teams.push({
            id: newTeamId,
            name: teamName,
            day: "週一",
            time: "19:00",
            shareMembers: [],
            noShareMembers: [],
            items: []
        });
        openModalTeams[newTeamId] = true;
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function renameTeam(cIndex, tIndex) {
        const currentTeam = bossCategories[cIndex].teams[tIndex];
        const newName = prompt(`請輸入新的隊伍名稱：`, currentTeam.name);
        if (newName !== null && newName.trim() !== '') {
            currentTeam.name = newName.trim();
            renderModalContent();
            if (window.saveToCloud) window.saveToCloud();
        }
    }

    function deleteTeam(cIndex, tIndex) {
        if (confirm(`確定刪除此隊伍嗎？`)) {
            bossCategories[cIndex].teams.splice(tIndex, 1);
            renderModalContent();
            if (window.saveToCloud) window.saveToCloud();
        }
    }

    function onTeamScheduleChange(cIndex, tIndex, field, value) {
        if (field === 'time') {
            value = formatTimeInput(value);
        }
        bossCategories[cIndex].teams[tIndex][field] = value;
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function removeMemberFromTeam(cIndex, tIndex, memberName) {
        let team = bossCategories[cIndex].teams[tIndex];
        team.shareMembers = (team.shareMembers || []).filter(m => m !== memberName);
        team.noShareMembers = (team.noShareMembers || []).filter(m => m !== memberName);
        
        team.items.forEach(item => {
            if (item.sellerName === memberName) item.sellerName = "";
            if (item.scissors) {
                item.scissors = item.scissors.filter(s => s.helperName !== memberName);
            }
        });
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function toggleMemberShareStatus(cIndex, tIndex, memberName) {
        let team = bossCategories[cIndex].teams[tIndex];
        if (!team.shareMembers) team.shareMembers = [];
        if (!team.noShareMembers) team.noShareMembers = [];

        if (team.shareMembers.includes(memberName)) {
            team.shareMembers = team.shareMembers.filter(m => m !== memberName);
            team.noShareMembers.push(memberName);
        } else {
            team.noShareMembers = team.noShareMembers.filter(m => m !== memberName);
            team.shareMembers.push(memberName);
        }
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function addMemberToTeam(cIndex, tIndex, memberName, targetZone = 'share') {
        let team = bossCategories[cIndex].teams[tIndex];
        if (!team.shareMembers) team.shareMembers = [];
        if (!team.noShareMembers) team.noShareMembers = [];

        team.shareMembers = team.shareMembers.filter(m => m !== memberName);
        team.noShareMembers = team.noShareMembers.filter(m => m !== memberName);

        if (targetZone === 'noShare') {
            team.noShareMembers.push(memberName);
        } else {
            team.shareMembers.push(memberName);
        }
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function addItemToTeam(cIndex, tIndex) {
        bossCategories[cIndex].teams[tIndex].items.push({ type: 'normal', name: '', price: '', sellerName: '', scissors: [] });
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function removeItemFromTeam(cIndex, tIndex, iIndex) {
        bossCategories[cIndex].teams[tIndex].items.splice(iIndex, 1);
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function addScissorToItem(cIndex, tIndex, iIndex) {
        if (!bossCategories[cIndex].teams[tIndex].items[iIndex].scissors) {
            bossCategories[cIndex].teams[tIndex].items[iIndex].scissors = [];
        }
        bossCategories[cIndex].teams[tIndex].items[iIndex].scissors.push({ helperName: '', cost: '' });
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function removeScissorFromItem(cIndex, tIndex, iIndex, sIndex) {
        bossCategories[cIndex].teams[tIndex].items[iIndex].scissors.splice(sIndex, 1);
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function onScissorCostInput(cIndex, tIndex, iIndex, sIndex, value) {
        bossCategories[cIndex].teams[tIndex].items[iIndex].scissors[sIndex].cost = value;
        calculateMainPersonLedger();
        if (window.saveToCloud) window.saveToCloud();
    }

    function onBossItemPriceInput(cIndex, tIndex, iIndex, value) {
        bossCategories[cIndex].teams[tIndex].items[iIndex].price = value;
        calculateMainPersonLedger();
        if (window.saveToCloud) window.saveToCloud();
    }

    function onScissorChange(cIndex, tIndex, iIndex, sIndex, field, value) {
        const item = bossCategories[cIndex].teams[tIndex].items[iIndex];
        item.scissors[sIndex][field] = value;
        
        if (field === 'helperName' && value) {
            item.sellerName = value;
        }
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function onTypeChange(cIndex, tIndex, iIndex, newType) {
        const item = bossCategories[cIndex].teams[tIndex].items[iIndex];
        item.type = newType;
        
        if (newType === 'normal') {
            item.name = '其餘物品總和';
        } else if (newType === 'internal') {
            if (item.name === '其餘物品總和') item.name = '';
        } else if (newType === 'scissors') {
            if (item.name === '其餘物品總和') item.name = '';
            if (!item.scissors || item.scissors.length === 0) {
                item.scissors = [{ helperName: item.sellerName || '', cost: '' }];
            }
        }
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function onBossItemChange(cIndex, tIndex, iIndex, field, value) {
        const item = bossCategories[cIndex].teams[tIndex].items[iIndex];
        item[field] = value;

        if (field === 'sellerName' && item.type === 'scissors' && item.scissors && item.scissors.length > 0) {
            item.scissors[0].helperName = value;
        }
        renderModalContent();
        if (window.saveToCloud) window.saveToCloud();
    }

    function handleDragStart(e, subName) {
        draggedSubName = subName;
        e.dataTransfer.setData('text/plain', subName);
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, cIndex, tIndex, targetZone) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (draggedSubName) {
            addMemberToTeam(cIndex, tIndex, draggedSubName, targetZone);
            draggedSubName = null;
        }
    }

    function onDetailToggle(detailKey, isExpanded) {
        openLedgerDetails[detailKey] = isExpanded;
    }

    function renderModalContent() {
        if (currentEditingCatIndex === null) return;
        const cat = bossCategories[currentEditingCatIndex];
        const cIndex = currentEditingCatIndex;

        document.getElementById('modalTitle').innerText = `${cat.name} - 隊伍與寶物管理`;

        let existingMembersInThisBoss = new Set();
        cat.teams.forEach(team => {
            (team.shareMembers || []).forEach(m => existingMembersInThisBoss.add(m));
            (team.noShareMembers || []).forEach(m => existingMembersInThisBoss.add(m));
        });

        const poolContainer = document.getElementById('modalSubPool');
        poolContainer.innerHTML = '';
        const allSubs = getAllSubMembers();
        const availableSubs = allSubs.filter(s => !existingMembersInThisBoss.has(s));

        if (availableSubs.length === 0) {
            poolContainer.innerHTML = `<div class="empty-tip">所有人員均已加入隊伍</div>`;
        } else {
            availableSubs.forEach(subName => {
                const tag = document.createElement('div');
                tag.className = 'sub-tag-draggable';
                tag.style.width = 'fit-content';
                tag.draggable = true;
                tag.ondragstart = (e) => handleDragStart(e, subName);
                tag.innerHTML = `<span>👤 ${subName}</span>`;
                poolContainer.appendChild(tag);

        const modalMainContent = document.getElementById('modalMainContent');
        modalMainContent.innerHTML = '';

        const typeOrder = { 'normal': 1, 'scissors': 2, 'internal': 3 };

        const teamsGrid = document.createElement('div');
        teamsGrid.className = 'teams-grid-vertical';

        cat.teams.forEach((team, tIndex) => {
            team.items.sort((a, b) => (typeOrder[a.type || 'normal'] || 1) - (typeOrder[b.type || 'normal'] || 1));

            const isTeamOpen = openModalTeams[team.id] === true;
            const teamCard = document.createElement('div');
            teamCard.className = `team-card ${isTeamOpen ? 'open' : ''}`;

            const shareList = team.shareMembers || [];
            const noShareList = team.noShareMembers || [];
            const allTeamMembers = [...shareList, ...noShareList];

            let teamGross = 0;
            team.items.forEach(it => { teamGross += (parseFloat(it.price) || 0); });

            const currentDay = team.day || "週一";
            const currentTime = team.time !== undefined ? team.time : "19:00";

            const teamHeader = document.createElement('div');
            teamHeader.className = 'team-header';
            teamHeader.onclick = () => toggleModalTeamOpen(team.id);
            teamHeader.innerHTML = `
                <span>
                    🛡️ ${team.name} 
                    <small style="color:var(--text-muted); font-size:0.85rem; margin-left:8px;">
                        (${currentDay} ${currentTime}) - (平分: ${shareList.length}人 / 不分: ${noShareList.length}人) ${teamGross > 0 ? `<span style="color:var(--primary-color);">[ 總計: ${Math.floor(teamGross).toLocaleString()} 幣 ]</span>` : ''}
                    </small>
                </span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="event.stopPropagation(); renameTeam(${cIndex}, ${tIndex})">✏️ 改名</button>
                    <button class="btn btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="event.stopPropagation(); deleteTeam(${cIndex}, ${tIndex})">✖ 刪除隊伍</button>
                    <span style="font-size:0.9rem; color:var(--text-muted);">${isTeamOpen ? '▲' : '▼'}</span>
                </div>
            `;

            let shareChipsHtml = shareList.length === 0 ? '<span class="empty-tip">拖拉人員至此平分</span>' :
                shareList.map(m => `<div class="member-chip chip-share" onclick="toggleMemberShareStatus(${cIndex}, ${tIndex}, '${m}')">${m} <span onclick="event.stopPropagation(); removeMemberFromTeam(${cIndex}, ${tIndex}, '${m}')">&times;</span></div>`).join('');

            let noShareChipsHtml = noShareList.length === 0 ? '<span class="empty-tip">拖拉人員至此不分</span>' :
                noShareList.map(m => `<div class="member-chip chip-no-share" onclick="toggleMemberShareStatus(${cIndex}, ${tIndex}, '${m}')">${m} <span onclick="event.stopPropagation(); removeMemberFromTeam(${cIndex}, ${tIndex}, '${m}')">&times;</span></div>`).join('');

            let quickSelectOptions = `<option value="">+ 快捷點擊加入隊員...</option>`;
            availableSubs.forEach(s => {
                quickSelectOptions += `<option value="${s}">${s}</option>`;
            });

            let daySelectHtml = `<select style="width:100px;" onchange="onTeamScheduleChange(${cIndex}, ${tIndex}, 'day', this.value)">`;
            daysList.forEach(d => {
                daySelectHtml += `<option value="${d}" ${currentDay === d ? 'selected' : ''}>${d}</option>`;
            });
            daySelectHtml += `</select>`;

            let itemsHtml = '';
            team.items.forEach((item, iIndex) => {
                const itemType = item.type || 'normal';

                let sellerOptions = `<option value="">選擇賣/買家...</option>`;
                allTeamMembers.forEach(m => {
                    const sel = item.sellerName === m ? 'selected' : '';
                    const labelText = itemType === 'internal' ? `${m} (買家)` : `${m} (賣家)`;
                    sellerOptions += `<option value="${m}" ${sel}>${labelText}</option>`;
                });
                let sellerSelectHtml = `<select onchange="onBossItemChange(${cIndex}, ${tIndex}, ${iIndex}, 'sellerName', this.value)">${sellerOptions}</select>`;

                let scissorsHtml = '';
                if (itemType === 'scissors') {
                    const scissors = item.scissors || [];
                    scissors.forEach((sc, sIndex) => {
                        let helperOptions = `<option value="">選擇剪刀人</option>`;
                        allTeamMembers.forEach(m => {
                            const sel = sc.helperName === m ? 'selected' : '';
                            helperOptions += `<option value="${m}" ${sel}>${m}</option>`;
                        });

                        scissorsHtml += `
                            <div class="scissors-row">
                                <select onchange="onScissorChange(${cIndex}, ${tIndex}, ${iIndex}, ${sIndex}, 'helperName', this.value)">${helperOptions}</select>
                                <input type="number" placeholder="成本" value="${sc.cost !== undefined ? sc.cost : ''}" oninput="onScissorCostInput(${cIndex}, ${tIndex}, ${iIndex}, ${sIndex}, this.value)" onchange="renderModalContent()">
                                <button class="btn btn-danger" style="padding:4px 8px;" onclick="removeScissorFromItem(${cIndex}, ${tIndex}, ${iIndex}, ${sIndex})">✖</button>
                            </div>
                        `;
                    });
                }

                itemsHtml += `
                    <div class="item-row">
                        <div class="item-main">
                            <select onchange="onTypeChange(${cIndex}, ${tIndex}, ${iIndex}, this.value)">
                                <option value="normal" ${itemType === 'normal' ? 'selected' : ''}>🟢 拍賣賣出 (扣3%稅)</option>
                                <option value="scissors" ${itemType === 'scissors' ? 'selected' : ''}>✂️ 拍賣賣出 (扣稅+剪刀)</option>
                                <option value="internal" ${itemType === 'internal' ? 'selected' : ''}>🤝 團內內購 (免3%稅)</option>
                            </select>
                            <input type="text" placeholder="寶物名稱" value="${item.name || ''}" onchange="onBossItemChange(${cIndex}, ${tIndex}, ${iIndex}, 'name', this.value)">
                            <input type="number" placeholder="拍賣金額" value="${item.price || ''}" oninput="onBossItemPriceInput(${cIndex}, ${tIndex}, ${iIndex}, this.value)" onchange="renderModalContent()">
                            ${sellerSelectHtml}
                            <button class="btn btn-danger" onclick="removeItemFromTeam(${cIndex}, ${tIndex}, ${iIndex})">刪除</button>
                        </div>
                        
                        ${itemType === 'scissors' ? `
                            <div class="scissors-section">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                    <span style="font-size:0.82rem; color:var(--primary-color); font-weight:bold;">✂️ 剪刀成本代墊：</span>
                                    <button class="btn btn-secondary" style="font-size:0.75rem; padding:3px 8px;" onclick="addScissorToItem(${cIndex}, ${tIndex}, ${iIndex})">➕ 新增剪刀人</button>
                                </div>
                                ${scissorsHtml || '<div class="empty-tip">請點擊上方按鈕新增剪刀人</div>'}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            const teamBody = document.createElement('div');
            teamBody.className = 'team-body';
            teamBody.innerHTML = `
                <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; background:#181818; padding:8px 12px; border-radius:6px;">
                    <span style="font-size:0.85rem; font-weight:bold; color:var(--primary-color);">⏰ 出團時間：</span>
                    ${daySelectHtml}
                    <input type="text" placeholder="輸入1900或19:00" value="${currentTime}" style="width:160px;" onchange="onTeamScheduleChange(${cIndex}, ${tIndex}, 'time', this.value)">
                </div>

                <div class="member-sections">
                    <div>
                        <label style="font-size:0.85rem; font-weight:bold; color:var(--success-color);">🟢 參與平分隊員：</label>
                        <div class="drop-zone share-zone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${cIndex}, ${tIndex}, 'share')">
                            ${shareChipsHtml}
                        </div>
                    </div>
                    <div>
                        <label style="font-size:0.85rem; font-weight:bold; color:var(--danger-color);">🔴 不參與平分隊員：</label>
                        <div class="drop-zone no-share-zone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${cIndex}, ${tIndex}, 'noShare')">
                            ${noShareChipsHtml}
                        </div>
                    </div>
                </div>

                <div style="margin-bottom:12px;">
                    <select onchange="if(this.value){ addMemberToTeam(${cIndex}, ${tIndex}, this.value); }">${quickSelectOptions}</select>
                </div>

                <label style="font-size:0.88rem; font-weight:bold; margin-bottom:8px; display:block;">掉落寶物、賣家與剪刀成本：</label>
                <div>${itemsHtml || '<div class="empty-tip" style="margin-bottom:10px;">尚未登記寶物</div>'}</div>
                <button class="btn" style="width:100%; margin-top:6px; padding:8px;" onclick="addItemToTeam(${cIndex}, ${tIndex})">➕ 新增寶物項目</button>
            `;

            teamCard.appendChild(teamHeader); teamCard.appendChild(teamBody);
            teamsGrid.appendChild(teamCard);
        });

        modalMainContent.appendChild(teamsGrid);

        const bottomAction = document.createElement('div');
        bottomAction.style.display = 'flex'; bottomAction.style.gap = '10px'; bottomAction.style.marginTop = '20px';
        bottomAction.innerHTML = `
            <button class="btn btn-secondary" style="flex:1; padding:12px; font-size:0.95rem;" onclick="addTeamToCategory(${cIndex})">➕ 為【${cat.name}】新增隊伍</button>
            <button class="btn btn-danger" style="padding:12px 20px; font-size:0.95rem;" onclick="deleteBossCategory(${cIndex})">🗑️ 刪除此 BOSS</button>
        `;
        modalMainContent.appendChild(bottomAction);

        calculateMainPersonLedger();
        renderSchedule();
    }

    function renderSchedule() {
        const calendarGrid = document.getElementById('calendarGrid');
        calendarGrid.innerHTML = '';

        daysList.forEach(dayName => {
            const dayCard = document.createElement('div');
            dayCard.className = 'day-card';

            let dayEvents = [];
            bossCategories.forEach(cat => {
                cat.teams.forEach(team => {
                    const teamDay = team.day || "週一";
                    if (teamDay === dayName) {
                        const timeDisplay = team.time ? team.time : "19:00";
                        dayEvents.push(`<div><strong>${timeDisplay}</strong><br>${cat.name} (${team.name})</div>`);
                    }
                });
            });

            dayCard.innerHTML = `
                <div class="day-title">${dayName}</div>
                ${dayEvents.length > 0 ? dayEvents.map(e => `<div class="day-event">${e}</div>`).join('') : '<div class="empty-tip">無行程</div>'}
            `;
            calendarGrid.appendChild(dayCard);
        });

        const reminderSelect = document.getElementById('selectedPersonReminder');
        const currentSel = reminderSelect.value;
        reminderSelect.innerHTML = '';
        people.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.innerText = `👤 ${p.name}`;
            if (p.name === currentSel) opt.selected = true;
            reminderSelect.appendChild(opt);
        });

        const activePersonName = reminderSelect.value || (people[0] ? people[0].name : '');
        const activePerson = people.find(p => p.name === activePersonName);

        const scheduleList = document.getElementById('personalScheduleList');
        scheduleList.innerHTML = '';

        if (activePerson && activePerson.subs) {
            let mySchedules = [];

            bossCategories.forEach(cat => {
                cat.teams.forEach(team => {
                    const allTeamMembers = [...(team.shareMembers || []), ...(team.noShareMembers || [])];
                    activePerson.subs.forEach(subName => {
                        if (allTeamMembers.includes(subName)) {
                            mySchedules.push({
                                dayName: team.day || "週一",
                                timeText: team.time || "19:00",
                                bossName: cat.name,
                                teamName: team.name,
                                subName: subName
                            });
                        }
                    });
                });
            });

            if (mySchedules.length > 0) {
                mySchedules.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'schedule-item';
                    item.innerHTML = `
                        <span>🗓️ <strong>${s.dayName} ${s.timeText}</strong> ── ${s.bossName} (${s.teamName})</span>
                        <span style="color:var(--primary-color); font-weight:bold;">[ ${s.subName} ]</span>
                    `;
                    scheduleList.appendChild(item);
                });
            } else {
                scheduleList.innerHTML = `<div class="empty-tip">【${activePersonName}】本週無任何王團出團行程</div>`;
            }
        }
    }

    function copyPersonalSchedule() {
        const reminderSelect = document.getElementById('selectedPersonReminder');
        const activePersonName = reminderSelect.value;
        const scheduleItems = document.querySelectorAll('#personalScheduleList .schedule-item');

        if (scheduleItems.length === 0) return alert(`【${activePersonName}】本週無行程可複製！`);

        let text = `🍁 【${activePersonName} 本週王團出團提醒】 🍁\n=========================\n`;
        scheduleItems.forEach(item => { text += `• ${item.innerText}\n`; });
        text += `=========================\n記得準時上線出團喔！`;

        navigator.clipboard.writeText(text).then(() => alert(`【${activePersonName}】的本週行程通知已成功複製！`)).catch(err => alert('複製失敗：' + err));
    }

    function render() {
        const peopleContainer = document.getElementById('peopleContainer');
        peopleContainer.innerHTML = '';
        people.forEach((person, pIndex) => {
            const isOpen = openPeople[person.id] === true;
            const card = document.createElement('div');
            card.className = `person-card ${isOpen ? 'open' : ''}`;

            const header = document.createElement('div');
            header.className = 'person-header';
            header.onclick = () => { openPeople[person.id] = !openPeople[person.id]; render(); };
            header.innerHTML = `
                <span>👤 ${person.name} (${person.subs.length})</span>
                <div>
                    <span style="color:var(--danger-color); margin-right:6px;" onclick="event.stopPropagation(); deleteMainPerson(${pIndex})">✖</span>
                    <span>${isOpen ? '▲' : '▼'}</span>
                </div>
            `;

            const body = document.createElement('div');
            body.className = 'person-body';
            body.innerHTML = `
                <div style="display:flex; gap:4px; margin-bottom:6px;">
                    <input type="text" id="subInput-${pIndex}" placeholder="子項 (如: ${person.name}-A)">
                    <button class="btn btn-secondary" style="padding:4px 6px; font-size:0.75rem;" onclick="addSubItem(${pIndex})">+ 子項</button>
                </div>
            `;

            const subList = document.createElement('div');
            subList.className = 'sub-list-grid';
            person.subs.forEach((subName, sIndex) => {
                const tag = document.createElement('div');
                tag.className = 'sub-tag-draggable';
                tag.draggable = true;
                tag.ondragstart = (e) => handleDragStart(e, subName);
                tag.innerHTML = `<span>${subName}</span> <span style="color:var(--danger-color)" onclick="deleteSubItem(${pIndex}, ${sIndex})">&times;</span>`;
                subList.appendChild(tag);
            });

            body.appendChild(subList);
            card.appendChild(header); card.appendChild(body);
            peopleContainer.appendChild(card);
        });

        const bossCategoryContainer = document.getElementById('bossCategoryContainer');
        bossCategoryContainer.innerHTML = '';

        bossCategories.forEach((cat, cIndex) => {
            let categoryTotalGross = 0;
            cat.teams.forEach(team => {
                team.items.forEach(it => { categoryTotalGross += (parseFloat(it.price) || 0); });
            });

            const pill = document.createElement('div');
            pill.className = 'boss-pill-card';
            pill.onclick = () => openBossModal(cIndex);
            pill.innerHTML = `
                <div class="boss-pill-info">
                    <span class="boss-pill-name">${cat.name}</span>
                    <span class="boss-pill-sub">${cat.teams.length} 個隊伍 ${categoryTotalGross > 0 ? `| <span style="color:var(--primary-color);">${Math.floor(categoryTotalGross).toLocaleString()} 幣</span>` : ''}</span>
                </div>
                <span style="color:var(--primary-color); font-size:0.85rem; font-weight:bold;">點擊編輯 ⚙️</span>
            `;
            bossCategoryContainer.appendChild(pill);
        });

        calculateMainPersonLedger();
        renderSchedule();
    }

    function calculateMainPersonLedger() {
        let totalGross = 0;
        let totalNet = 0;

        let mainBalances = {};
        people.forEach(p => {
            mainBalances[p.name] = { total: 0, bossMap: {} };
        });

        bossCategories.forEach(cat => {
            cat.teams.forEach(team => {
                const sharers = team.shareMembers || [];

                team.items.forEach(item => {
                    const price = parseFloat(item.price) || 0;
                    if (price <= 0) return;

                    const itemType = item.type || 'normal';
                    const netPrice = (itemType === 'internal') ? price : price * 0.97;
                    totalGross += price;
                    totalNet += netPrice;

                    const sellerSub = item.sellerName;
                    const sellerMain = sellerSub ? getMainPersonBySub(sellerSub) : null;

                    if (sellerMain && mainBalances[sellerMain]) {
                        mainBalances[sellerMain].total -= netPrice;
                        initBossDetail(mainBalances[sellerMain].bossMap, team.name, sellerSub);
                        mainBalances[sellerMain].bossMap[team.name][sellerSub].subTotal -= netPrice;
                        mainBalances[sellerMain].bossMap[team.name][sellerSub].logs.push(`(${sellerSub}) 買走/賣出實收 -${Math.floor(netPrice).toLocaleString()} 幣`);
                    }

                    if (itemType === 'normal' || itemType === 'internal') {
                        if (netPrice > 0 && sharers.length > 0) {
                            const share = netPrice / sharers.length;
                            sharers.forEach(sub => {
                                const mainName = getMainPersonBySub(sub);
                                if (mainBalances[mainName]) {
                                    mainBalances[mainName].total += share;
                                    initBossDetail(mainBalances[mainName].bossMap, team.name, sub);
                                    mainBalances[mainName].bossMap[team.name][sub].subTotal += share;
                                    mainBalances[mainName].bossMap[team.name][sub].logs.push(`(${sub}) 平分 +${Math.floor(share).toLocaleString()} 幣`);
                                }
                            });
                        }
                    } 
                    else if (itemType === 'scissors') {
                        let totalScissorsCost = 0;
                        const scissors = item.scissors || [];

                        scissors.forEach(sc => {
                            const cost = parseFloat(sc.cost) || 0;
                            const helperSub = sc.helperName;
                            if (helperSub && cost > 0) {
                                totalScissorsCost += cost;
                                const mainName = getMainPersonBySub(helperSub);
                                if (mainBalances[mainName]) {
                                    mainBalances[mainName].total += cost;
                                    initBossDetail(mainBalances[mainName].bossMap, team.name, helperSub);
                                    mainBalances[mainName].bossMap[team.name][helperSub].subTotal += cost;
                                    mainBalances[mainName].bossMap[team.name][helperSub].logs.push(`(${helperSub}) 拿回剪刀成本 +${Math.floor(cost).toLocaleString()} 幣`);
                                }
                            }
                        });

                        const profit = netPrice - totalScissorsCost;
                        if (profit > 0 && sharers.length > 0) {
                            const shareProfit = profit / sharers.length;
                            sharers.forEach(sub => {
                                const mainName = getMainPersonBySub(sub);
                                if (mainBalances[mainName]) {
                                    mainBalances[mainName].total += shareProfit;
                                    initBossDetail(mainBalances[mainName].bossMap, team.name, sub);
                                    mainBalances[mainName].bossMap[team.name][sub].subTotal += shareProfit;
                                    mainBalances[mainName].bossMap[team.name][sub].logs.push(`(${sub}) 純利潤平分 +${Math.floor(shareProfit).toLocaleString()} 幣`);
                                }
                            });
                        }
                    }
                });
            });
        });

        document.getElementById('sumGross').innerText = Math.floor(totalGross).toLocaleString() + " 幣";
        document.getElementById('sumNet').innerText = Math.floor(totalNet).toLocaleString() + " 幣";

        const ledgerBody = document.getElementById('ledgerBody');
        ledgerBody.innerHTML = '';

        people.forEach(p => {
            const mainName = p.name;
            const data = mainBalances[mainName];
            const amount = Math.floor(data.total);
            const isPaid = payoutStatus[mainName] || false;

            let detailsHtml = '';
            let bossEntries = Object.entries(data.bossMap);

            if (bossEntries.length > 0) {
                let bossLines = [];
                bossEntries.forEach(([bossName, subs]) => {
                    Object.entries(subs).forEach(([subName, subData]) => {
                        const amt = Math.floor(subData.subTotal);
                        const sign = amt > 0 ? `+${amt.toLocaleString()}` : `${amt.toLocaleString()}`;
                        
                        let logItems = subData.logs.map(l => `<div style="padding-left:12px; color:#888;">├── ${l}</div>`).join('');

                        const detailKey = `${mainName}_${bossName}_${subName}`;
                        const isDetailOpen = !!openLedgerDetails[detailKey];

                        bossLines.push(`
                            <details style="margin-top:3px; cursor:pointer;" ${isDetailOpen ? 'open' : ''} ontoggle="onDetailToggle('${detailKey}', this.open)">
                                <summary style="color:#a0a0a0; font-size:0.75rem;">
                                    【${bossName}】(${subName}) <strong>${sign}</strong> 幣
                                </summary>
                                <div style="margin-top:2px; font-size:0.7rem;">
                                    ${logItems}
                                </div>
                            </details>
                        `);
                    });
                });
                detailsHtml = `<div class="boss-detail-text">${bossLines.join('')}</div>`;
            } else {
                detailsHtml = `<div class="empty-tip">無紀錄</div>`;
            }

            let amountDisplay = '';
            if (amount > 0) {
                amountDisplay = `<span class="val-positive">+${amount.toLocaleString()}</span>`;
            } else if (amount < 0) {
                amountDisplay = `<span class="val-negative">${amount.toLocaleString()}</span>`;
            } else {
                amountDisplay = `<span style="color:#aaa; font-family:monospace;">0</span>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>👤 ${mainName}</strong></td>
                <td>
                    ${amountDisplay}
                    ${detailsHtml}
                </td>
                <td>
                    <button class="status-btn ${isPaid ? 'status-paid' : 'status-pending'}" onclick="payoutStatus['${mainName}']=!payoutStatus['${mainName}']; render(); if(window.saveToCloud) window.saveToCloud();">
                        ${isPaid ? '🟢 結清' : '🔴 未清'}
                    </button>
                </td>
            `;
            ledgerBody.appendChild(tr);
        });
    }

    function initBossDetail(bossMap, bossName, subName) {
        if (!bossMap[bossName]) bossMap[bossName] = {};
        if (!bossMap[bossName][subName]) {
            bossMap[bossName][subName] = { subTotal: 0, logs: [] };
        }
    }

    function copyLedger() {
        let text = `🍁 【新楓之谷本週跨團對帳單】 🍁\n=========================\n`;
        text += `拍賣總銷售：${document.getElementById('sumGross').innerText}\n扣稅 3% 後總淨利：${document.getElementById('sumNet').innerText}\n=========================\n`;

        people.forEach(p => {
            const mainName = p.name;
            const trs = Array.from(document.querySelectorAll('#ledgerBody tr'));
            const row = trs.find(r => r.cells[0].innerText.includes(mainName));
            if (row) {
                const totalText = row.cells[1].querySelector('span').innerText;
                const status = payoutStatus[mainName] ? '已結清' : '未處理';
                text += `👤 ${mainName} ： ${totalText} 楓幣 [${status}]\n`;

                const summaries = row.cells[1].querySelectorAll('summary');
                summaries.forEach(s => {
                    const cleanText = s.innerText.trim();
                    text += `  └ ${cleanText}\n`;
                });
                text += `-------------------------\n`;
            }
        });

        text += `請大家核對帳務，辛苦大家！`;
        navigator.clipboard.writeText(text).then(() => alert('主人員總帳單已成功複製！')).catch(err => alert('複製失敗：' + err));
    }

    render();
</script>
</body>
</html>
